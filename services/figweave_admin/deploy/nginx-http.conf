# Include once inside nginx's http block (/etc/nginx/conf.d/figweave-admin.conf).
limit_req_zone $binary_remote_addr zone=figweave_usage:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=figweave_login:10m rate=5r/m;
map $http_user_agent $figweave_browser {
    default 0;
    ~*(bot|spider|crawler|headless|lighthouse|monitor|preview|slurp|facebookexternalhit) 0;
    ~*Mozilla/ 1;
}
# Only predeclared public page names can enter future traffic logs.
map $uri $figweave_page {
    default "-";
    / /;
    /index.html /;
    /try/ /try/;
    /try/index.html /try/;
    /r/ /r/;
    /r/index.html /r/;
    /charts/ /charts/;
    /charts/index.html /charts/;
}
# No IP, arbitrary path, query string, referrer, or raw User-Agent.
log_format figweave_counts escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$figweave_page","status":"$status","browser":"$figweave_browser"}';
