# Include inside the HTTPS site server. Keep the desktop server private.
location = /admin { return 301 /admin/; }
location = /admin/api/login {
    limit_req zone=figweave_login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/figweave-admin-proxy.conf;
}
location ^~ /admin/ {
    include /etc/nginx/snippets/figweave-admin-proxy.conf;
}
location = /usage/event {
    limit_req zone=figweave_usage burst=20 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/figweave-admin-proxy.conf;
}
