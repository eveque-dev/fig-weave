name: FigWeave preview installers
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TAVOTTO_NO_TELEMETRY: '1'
  TAVOTTO_REQUIRE_RUNTIME: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e . pyinstaller
      - run: python scripts/build_desktop.py
      - name: Verify bundled engine
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python scripts/smoke_app.py --exe dist/Tavotto/Tavotto.exe --expect-source bundled --expect-runtime
          else
            python scripts/smoke_app.py --exe dist/Tavotto/Tavotto --expect-source bundled --expect-runtime
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FigWeave-preview-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
